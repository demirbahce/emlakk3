<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demirbahçe Emlak</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: white; /* Arka plan beyaz yapıldı */
        font-family: "Arial", sans-serif;
        overflow: hidden;
      }

      .splash-screen {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100px;
        height: 100px;
        transform: translate(-50%, -50%);
        animation: logoExpand 3s ease-out forwards,
          logoMove 2s ease-in-out 4s forwards;
        z-index: 1;
      }

      .text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: green;
        font-size: 4rem;
        font-weight: bold;
        z-index: 2;
        opacity: 0;
        animation: textFadeIn 2s ease-out 3s forwards,
          textMove 2s ease-in-out 6s forwards;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      }

      @keyframes logoExpand {
        0% {
          width: 100px;
          height: 100px;
        }
        100% {
          width: 100vw;
          height: 100vh;
        }
      }

      @keyframes logoMove {
        0% {
          width: 100vw;
          height: 100vh;
          top: 0;
          left: 0;
          transform: translate(0, 0);
        }
        100% {
          width: 80px;
          height: 80px;
          top: 20px;
          left: 20px;
          transform: none;
        }
      }

      @keyframes textFadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes textMove {
        0% {
          top: 50%;
          left: 50%;
          font-size: 4rem;
          transform: translate(-50%, -50%);
        }
        100% {
          top: 110px;
          left: 60px;
          font-size: 1.2rem;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-screen">
      <img class="logo" src="logo.png" alt="Logo" />
      <div class="text">Demirbahçe Emlak</div>
    </div>
  </body>
</html>
